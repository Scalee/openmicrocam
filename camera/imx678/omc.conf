# OpenMicroCam settings for the IMX678 camera (black YIZHAN 4K), read at every boot by /customer/omc/hook.sh.
# 1 = on, 0 = off; a change takes effect at the next boot. A file OMC-STOCK in the SD card's root turns everything off
# for that boot.

# USB network (RNDIS: camera 192.168.1.100, MTU 400) and telnet
OMC_RNDIS=1

# microcamd (OpenMicroCam) in place of the vendor app; 0 = the vendor app; try = the next boot only. Three boots in a
# row that never reach a minute of microcamd set this back to 0.
OMC_MICROCAMD=1
